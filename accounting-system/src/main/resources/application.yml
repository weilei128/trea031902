server:
  port: 8080

spring:
  application:
    name: accounting-system

# 应用配置
app:
  data-path: data
  user-file: users.csv
  transaction-file: transactions.csv

# JWT配置
jwt:
  secret: accounting-system-secret-key-2024
  expiration: 86400000  # 24小时，单位毫秒

# 日志配置
logging:
  level:
    com.accounting: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
